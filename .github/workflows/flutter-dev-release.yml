name: NASQO Flutter — Signed Development APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-development-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: stable
          cache: true
      - name: Resolve dependencies and verify Flutter
        working-directory: flutter_app
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.NASQO_DEV_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.NASQO_DEV_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.NASQO_DEV_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NASQO_DEV_KEY_ALIAS }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            [[ -n "${!name}" ]] || { echo "Missing development signing secret: $name"; exit 1; }
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/nasqo-dev.jks"
          chmod 600 "$RUNNER_TEMP/nasqo-dev.jks"
          echo "NASQO_DEV_KEYSTORE_PATH=$RUNNER_TEMP/nasqo-dev.jks" >> "$GITHUB_ENV"
          echo "NASQO_DEV_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "NASQO_DEV_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "NASQO_DEV_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
      - name: Build signed APK
        working-directory: flutter_app
        run: |
          flutter build apk --release --android-skip-build-dependency-validation --build-number="$((10000 + GITHUB_RUN_NUMBER))"
      - name: Verify APK signature and identity
        working-directory: flutter_app
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose "$APK"
          "$AAPT" dump badging "$APK" | head -1 | grep -F "name='com.indexesstore.nasqo_qa'"
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: nasqo-signed-dev-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
