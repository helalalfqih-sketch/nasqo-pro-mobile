name: NASQO Flutter — Offline Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter-offline-apk.yml'
  pull_request:
    paths:
      - 'flutter_app/**'
  workflow_dispatch:
    inputs:
      hybrid_review:
        description: 'Exercise the packaged React screens in a disposable, offline Android WebView (debug APK)'
        required: false
        type: boolean
        default: false
      reuse_debug_run:
        description: 'Prior debug build run with exactly the same application tree (hybrid device QA only)'
        type: string
        required: false
      signed_run:
        description: 'Optional successful signed workflow run on this revision for an offline upgrade test'
        required: false
        type: string
      upgrade_baseline:
        description: 'Signed Android upgrade baseline. Select 10013 for the audited 10014 candidate.'
        required: false
        type: choice
        default: '10004'
        options: ['10004', '10013']

permissions:
  contents: read

jobs:
  offline-apk:
    if: ${{ !inputs.reuse_debug_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: stable
          cache: true
      - name: Use Java 17 with Flutter Android Gradle
        run: |
          java --version
          flutter config --jdk-dir="$JAVA_HOME"
      - name: Resolve Flutter packages
        working-directory: flutter_app
        run: flutter pub get
      - name: Static analysis
        working-directory: flutter_app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Unit tests
        working-directory: flutter_app
        run: flutter test
      - name: Compile Android update bridge and application plugins
        if: github.event_name == 'pull_request'
        working-directory: flutter_app/android
        run: bash gradlew :app:compileDebugKotlin --no-daemon
      - name: Build Android APK
        if: github.event_name == 'workflow_dispatch' && !inputs.signed_run
        working-directory: flutter_app
        run: flutter build apk --debug --android-skip-build-dependency-validation
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && !inputs.signed_run
        with:
          name: nasqo-pro-android-apk
          path: flutter_app/build/app/outputs/flutter-apk/*.apk
          retention-days: 14

  offline-device:
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && (needs.offline-apk.result == 'success' || (inputs.hybrid_review && inputs.reuse_debug_run && needs.offline-apk.result == 'skipped')) }}
    needs: offline-apk
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify the source of the existing debug APK
        if: inputs.reuse_debug_run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.reuse_debug_run }}
          SIGNED_RUN: ${{ inputs.signed_run }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ && -z "$SIGNED_RUN" ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > "$RUNNER_TEMP/debug-run.json"
          jq -e --arg repo "$GITHUB_REPOSITORY" '.head_repository.full_name==$repo and .event=="workflow_dispatch" and .path==".github/workflows/flutter-offline-apk.yml"' "$RUNNER_TEMP/debug-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs" --jq '.jobs[] | select(.name=="offline-apk") | .conclusion' | grep -qx success
          source_sha="$(jq -r '.head_sha' "$RUNNER_TEMP/debug-run.json")"
          git merge-base --is-ancestor "$source_sha" HEAD
          git diff --exit-code "$source_sha" HEAD -- flutter_app src qa/hybrid_home/build.mjs qa/hybrid_home/metrics.tsx qa/hybrid_home/host.tsx qa/hybrid_home/workspace.ts qa/hybrid_home/DirectoryScreen.tsx qa/hybrid_home/directories.mjs qa/hybrid_home/directory_amounts.ts qa/hybrid_home/android.css package-lock.json
          echo "HYBRID_APK_SOURCE=$source_sha" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        if: '!inputs.signed_run'
        with:
          name: nasqo-pro-android-apk
          github-token: ${{ github.token }}
          run-id: ${{ inputs.reuse_debug_run || github.run_id }}
          path: offline-apk
      - name: Check signed test input
        if: inputs.signed_run
        env:
          RUN_ID: ${{ inputs.signed_run }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > "$RUNNER_TEMP/run.json"
          jq -e --arg branch "$GITHUB_REF_NAME" '.head_branch == $branch and .conclusion == "success" and .path == ".github/workflows/flutter-dev-release.yml"' "$RUNNER_TEMP/run.json"
          candidate="$(jq -r '.head_sha' "$RUNNER_TEMP/run.json")"
          git merge-base --is-ancestor "$candidate" HEAD
          git diff --exit-code "$candidate" HEAD -- flutter_app ':(exclude)flutter_app/test/**' .github/workflows/flutter-dev-release.yml
      - name: Fetch the signed candidate
        if: inputs.signed_run
        uses: actions/download-artifact@v4
        with:
          name: nasqo-signed-dev-apk
          github-token: ${{ github.token }}
          run-id: ${{ inputs.signed_run }}
          path: candidate
      - name: Fetch the prior signed version
        if: inputs.signed_run && inputs.upgrade_baseline != '10013'
        run: |
          curl --fail --retry 3 --proto '=https' https://erp.indexesstore.com/flutter-updates/nasqo-dev-10004.apk -o baseline.apk
          echo '7401c3d1cebf6be959b8c5b69fb744f9769091d582fdc62d86b04bbd2cdfdec2  baseline.apk' | sha256sum -c -
      - name: Verify the direct 10013 to 10014 inputs
        if: inputs.upgrade_baseline == '10013'
        env:
          SIGNED_RUN: ${{ inputs.signed_run }}
        run: |
          set -euo pipefail
          test "$SIGNED_RUN" = 44929394951
          curl --fail --retry 3 --proto '=https' https://erp.indexesstore.com/flutter-updates/nasqo-dev-10013.apk -o baseline.apk
          echo '40d08a52af3bad0ff9d418c2417ead42dfab809681c84fe6823fc384067e4c6b  baseline.apk' | sha256sum -c -
          echo 'fed19174edd70fcfca0593376aefc811f5701721cb90a6a1234b1d4f2c2514c4  candidate/app-release.apk' | sha256sum -c -
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          for apk in baseline.apk candidate/app-release.apk; do
            "$signer" verify --verbose "$apk"
            keytool -printcert -rfc -jarfile "$apk" > "$RUNNER_TEMP/signer.pem"
            test "$(grep -c 'BEGIN CERTIFICATE' "$RUNNER_TEMP/signer.pem")" = 1
            openssl x509 -in "$RUNNER_TEMP/signer.pem" -outform DER -out "$RUNNER_TEMP/signer.der"
            echo "0df120c5300269f289cf66ccf48aa9ce81e295055e9f7ae80159ee021e3a5a79  $RUNNER_TEMP/signer.der" | sha256sum -c -
          done
      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-node@v4
        if: inputs.hybrid_review
        with:
          node-version: 24
          cache: npm
      - name: Prepare the React comparison for the debug APK
        if: inputs.hybrid_review
        run: |
          npm ci --ignore-scripts
          npm run check:runtime
          node qa/hybrid_home/build.mjs
          git diff --exit-code -- flutter_app/android/app/src/main/assets/hybrid_home
          node qa/hybrid_home/build.mjs --reference /tmp/nasqo-hybrid-ref
          CHROME_BIN=/usr/bin/google-chrome node qa/hybrid_home/reports-regression.mjs hybrid-evidence/fixed-web-reports
          CHROME_BIN=/usr/bin/google-chrome node qa/hybrid_home/browser.mjs hybrid-evidence/browser-check 427 900
          python3 -m pip install Pillow
      - name: Exercise the APK in airplane mode
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.hybrid_review && 35 || 30 }}
          target: ${{ inputs.hybrid_review && 'google_apis' || 'default' }}
          disable-animations: true
          arch: x86_64
          profile: pixel_4
          script: ${{ inputs.hybrid_review && 'CHROME_BIN=/usr/bin/google-chrome python3 qa/hybrid_home/android_review.py --debug offline-apk/app-debug.apk' || inputs.upgrade_baseline == '10013' && 'python3 qa/tools/direct_signed_upgrade.py baseline.apk candidate/app-release.apk' || inputs.signed_run && 'python3 flutter_app/test/android_upgrade_smoke.py baseline.apk candidate/app-release.apk' || 'python3 flutter_app/test/android_offline_smoke.py' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-screen-checks
          path: |
            offline-check/*.png
            offline-check/*.json
            hybrid-evidence/
