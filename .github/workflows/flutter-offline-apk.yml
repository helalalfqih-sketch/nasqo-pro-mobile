name: NASQO Flutter — Offline Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter-offline-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Use Java 17 with Flutter Android Gradle
        run: |
          java --version
          flutter config --jdk-dir="$JAVA_HOME"
      - name: Resolve Flutter packages
        working-directory: flutter_app
        run: flutter pub get
      - name: Static analysis
        working-directory: flutter_app
        run: flutter analyze --no-fatal-infos || true
      - name: Unit tests
        working-directory: flutter_app
        run: flutter test
      - name: Build Android APK
        working-directory: flutter_app
        run: flutter build apk --debug --android-skip-build-dependency-validation
      - uses: actions/upload-artifact@v4
        with:
          name: nasqo-pro-android-apk
          path: flutter_app/build/app/outputs/flutter-apk/*.apk
          retention-days: 14
