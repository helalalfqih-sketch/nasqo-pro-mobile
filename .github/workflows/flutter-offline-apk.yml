name: NASQO Flutter — Offline Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter-offline-apk.yml'
  pull_request:
    paths:
      - 'flutter_app/**'
  workflow_dispatch:
    inputs:
      signed_run:
        description: 'Optional successful signed workflow run on this revision for an offline upgrade test'
        required: false
        type: string

permissions:
  contents: read

jobs:
  offline-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: stable
          cache: true
      - name: Use Java 17 with Flutter Android Gradle
        run: |
          java --version
          flutter config --jdk-dir="$JAVA_HOME"
      - name: Resolve Flutter packages
        working-directory: flutter_app
        run: flutter pub get
      - name: Static analysis
        working-directory: flutter_app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Unit tests
        working-directory: flutter_app
        run: flutter test
      - name: Compile Android update bridge and application plugins
        if: github.event_name == 'pull_request'
        working-directory: flutter_app/android
        run: bash gradlew :app:compileDebugKotlin --no-daemon
      - name: Build Android APK
        if: github.event_name == 'workflow_dispatch' && !inputs.signed_run
        working-directory: flutter_app
        run: flutter build apk --debug --android-skip-build-dependency-validation
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && !inputs.signed_run
        with:
          name: nasqo-pro-android-apk
          path: flutter_app/build/app/outputs/flutter-apk/*.apk
          retention-days: 14

  offline-device:
    if: github.event_name == 'workflow_dispatch'
    needs: offline-apk
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        if: '!inputs.signed_run'
        with:
          name: nasqo-pro-android-apk
          path: offline-apk
      - name: Check signed test input
        if: inputs.signed_run
        env:
          RUN_ID: ${{ inputs.signed_run }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > "$RUNNER_TEMP/run.json"
          jq -e --arg branch "$GITHUB_REF_NAME" '.head_branch == $branch and .conclusion == "success" and .path == ".github/workflows/flutter-dev-release.yml"' "$RUNNER_TEMP/run.json"
          candidate="$(jq -r '.head_sha' "$RUNNER_TEMP/run.json")"
          git merge-base --is-ancestor "$candidate" HEAD
          git diff --exit-code "$candidate" HEAD -- flutter_app ':(exclude)flutter_app/test/**' .github/workflows/flutter-dev-release.yml
      - name: Fetch the signed candidate
        if: inputs.signed_run
        uses: actions/download-artifact@v4
        with:
          name: nasqo-signed-dev-apk
          github-token: ${{ github.token }}
          run-id: ${{ inputs.signed_run }}
          path: candidate
      - name: Fetch the prior signed version
        if: inputs.signed_run
        run: |
          curl --fail --retry 3 --proto '=https' https://erp.indexesstore.com/flutter-updates/nasqo-dev-10004.apk -o baseline.apk
          echo '7401c3d1cebf6be959b8c5b69fb744f9769091d582fdc62d86b04bbd2cdfdec2  baseline.apk' | sha256sum -c -
      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise the APK in airplane mode
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_4
          script: ${{ inputs.signed_run && 'python3 flutter_app/test/android_upgrade_smoke.py baseline.apk candidate/app-release.apk' || 'python3 flutter_app/test/android_offline_smoke.py' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-screen-checks
          path: offline-check/*.png
