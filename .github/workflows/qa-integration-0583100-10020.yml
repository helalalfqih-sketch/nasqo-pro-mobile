name: QA pinned integration source and signed Android 10020
on:
  push:
    branches: [qa/release-react-sqlite-0583100-10020]
permissions:
  contents: read
env:
  SOURCE_SHA: '058310087cf8624568cd1665480d1f9acf5e1449'
  SIGNER_CERT_SHA: '0df120c5300269f289cf66ccf48aa9ce81e295055e9f7ae80159ee021e3a5a79'
jobs:
  safe-source-and-web:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Load QA packaging script from isolated QA branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: cp qa/release-tools/sanitized_snapshot.py "$RUNNER_TEMP/sanitized_snapshot.py"
      - name: Checkout exact integration source; no editor branch changes
        uses: actions/checkout@v4
        with:
          ref: 058310087cf8624568cd1665480d1f9acf5e1449
          persist-credentials: false
      - name: Snapshot pinned React Flutter and tools without sensitive data
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python3 "$RUNNER_TEMP/sanitized_snapshot.py"
      - uses: actions/upload-artifact@v4
        with:
          name: nasqo-full-source-sanitized-0583100
          path: |
            .qa-out/nasqo-complete-source-0583100-sanitized.zip
            .qa-out/source-summary.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
          cache: npm
      - name: Build isolated React QA web assets
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit
          npm run check:runtime
          npm run build
          test -s dist/client/index.html
          tar -czf .qa-out/nasqo-qa-web-bundle-0583100.tar.gz -C dist client
          sha256sum .qa-out/nasqo-qa-web-bundle-0583100.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: nasqo-qa-web-bundle-0583100
          path: .qa-out/nasqo-qa-web-bundle-0583100.tar.gz
          if-no-files-found: error
          retention-days: 14
  signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 058310087cf8624568cd1665480d1f9acf5e1449
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: stable
          cache: true
      - name: Package exact React integration for native Android
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit
          npm run check:runtime
          npm run build:hybrid
          test -s flutter_app/assets/react/index.html
      - name: Flutter analysis and native SQLite tests
        working-directory: flutter_app
        shell: bash
        run: |
          set -euo pipefail
          flutter config --jdk-dir="$JAVA_HOME"
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          bash ../qa/tools/test-linux.sh
      - name: Restore established QA keystore using existing GitHub secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.NASQO_DEV_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.NASQO_DEV_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.NASQO_DEV_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NASQO_DEV_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" && test -n "$STORE_PASSWORD" && test -n "$KEY_PASSWORD" && test -n "$KEY_ALIAS"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/nasqo-qa.jks"
          chmod 600 "$RUNNER_TEMP/nasqo-qa.jks"
          {
            echo "NASQO_DEV_KEYSTORE_PATH=$RUNNER_TEMP/nasqo-qa.jks"
            echo "NASQO_DEV_KEYSTORE_PASSWORD=$STORE_PASSWORD"
            echo "NASQO_DEV_KEY_PASSWORD=$KEY_PASSWORD"
            echo "NASQO_DEV_KEY_ALIAS=$KEY_ALIAS"
          } >> "$GITHUB_ENV"
      - name: Build release APK with versionCode 10020
        working-directory: flutter_app
        run: flutter build apk --release --android-skip-build-dependency-validation --build-number=10020
      - name: Verify Android identity, QA certificate, v2 signing, SHA-256
        shell: bash
        run: |
          set -euo pipefail
          APK=flutter_app/build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          test -n "$APKSIGNER" && test -n "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/verify.txt"
          grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true' "$RUNNER_TEMP/verify.txt"
          grep -F 'Number of signers: 1' "$RUNNER_TEMP/verify.txt"
          keytool -printcert -rfc -jarfile "$APK" > "$RUNNER_TEMP/signer.pem"
          test "$(grep -c '^-----BEGIN CERTIFICATE-----' "$RUNNER_TEMP/signer.pem")" -eq 1
          openssl x509 -in "$RUNNER_TEMP/signer.pem" -outform DER -out "$RUNNER_TEMP/signer.der"
          actual="$(sha256sum "$RUNNER_TEMP/signer.der" | cut -d' ' -f1)"
          echo "Verified SHA-256 signer certificate fingerprint: $actual"
          test "$actual" = "$SIGNER_CERT_SHA" || { echo 'QA signer certificate mismatch'; exit 1; }
          info="$("$AAPT" dump badging "$APK" | head -1)"
          printf '%s\n' "$info" | grep -F "name='com.indexesstore.nasqo_qa'"
          printf '%s\n' "$info" | grep -F "versionCode='10020'"
          mkdir -p .qa-out
          cp "$APK" .qa-out/nasqo-qa-10020.apk
          cd .qa-out
          sha256sum nasqo-qa-10020.apk > apk.sha256
          python3 - <<'PY'
          import json,hashlib,pathlib
          p=pathlib.Path('nasqo-qa-10020.apk')
          result={'source_sha':'058310087cf8624568cd1665480d1f9acf5e1449','version_code':10020,'package':'com.indexesstore.nasqo_qa','signer_sha256':'0df120c5300269f289cf66ccf48aa9ce81e295055e9f7ae80159ee021e3a5a79','apk_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'apk_bytes':p.stat().st_size,'qa_only':True}
          pathlib.Path('release-metadata.json').write_text(json.dumps(result,indent=2)+'\n')
          print('SIGNED_QA_RELEASE_VERIFIED',json.dumps(result))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nasqo-qa-signed-10020-0583100
          path: |
            .qa-out/nasqo-qa-10020.apk
            .qa-out/apk.sha256
            .qa-out/release-metadata.json
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary QA keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/nasqo-qa.jks"
  upgrade-10019-to-10020:
    needs: signed-release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Load isolated QA upgrade script
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: cp qa/release-tools/signed_upgrade.py "$RUNNER_TEMP/signed_upgrade.py"
      - uses: actions/checkout@v4
        with:
          ref: 058310087cf8624568cd1665480d1f9acf5e1449
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: nasqo-qa-signed-10020-0583100
          path: candidate
      - name: Fetch and verify signed 10019 QA baseline
        shell: bash
        run: |
          set -euo pipefail
          curl -fLSs --retry 3 --proto '=https' https://erp.indexesstore.com/flutter-updates/nasqo-dev-10019.apk -o baseline.apk
          echo '36bac5302e4c31aa38e5d6a2e8ec39af29c8c1cbe4dcb9b2d2011d7ec2675d0a  baseline.apk' | sha256sum -c -
          cd candidate
          sha256sum -c apk.sha256
      - name: Enable KVM on isolated Android emulator runner
        shell: bash
        run: |
          test -c /dev/kvm
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
      - name: Signed upgrade, offline launch and SQLite preservation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          script: python3 "$RUNNER_TEMP/signed_upgrade.py" baseline.apk candidate/nasqo-qa-10020.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nasqo-qa-10020-upgrade-evidence
          path: qa-upgrade-evidence/
          if-no-files-found: warn
          retention-days: 14
