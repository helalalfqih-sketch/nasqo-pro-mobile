name: Signed QA 10021 React workspace
on:
  push:
    branches: [qa/react-release-10021]
    paths:
      - 'flutter_app/**'
      - 'react-hybrid/**'
      - '.github/workflows/qa-react-release-10021.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: stable
          cache: true
      - name: Build and test offline React
        run: |
          npm ci --ignore-scripts --no-audit
          npm run check:runtime
          npm run build:hybrid
          git diff --exit-code -- flutter_app/assets/react
      - name: Analyze and test Flutter with SQLite
        working-directory: flutter_app
        run: |
          flutter config --jdk-dir="$JAVA_HOME"
          flutter pub get
          flutter analyze --no-fatal-infos
          bash ../qa/tools/test-linux.sh
      - name: Build AOT release with the existing QA identity
        working-directory: flutter_app
        env:
          QA_KEYSTORE: ${{ secrets.NASQO_DEV_KEYSTORE_BASE64 }}
          NASQO_DEV_KEYSTORE_PASSWORD: ${{ secrets.NASQO_DEV_KEYSTORE_PASSWORD }}
          NASQO_DEV_KEY_PASSWORD: ${{ secrets.NASQO_DEV_KEY_PASSWORD }}
          NASQO_DEV_KEY_ALIAS: ${{ secrets.NASQO_DEV_KEY_ALIAS }}
        run: |
          set -euo pipefail
          umask 077
          export NASQO_DEV_KEYSTORE_PATH="$RUNNER_TEMP/nasqo-qa.jks"
          trap 'rm -f "$NASQO_DEV_KEYSTORE_PATH"' EXIT
          test -n "$QA_KEYSTORE"
          printf '%s' "$QA_KEYSTORE" | base64 -d > "$NASQO_DEV_KEYSTORE_PATH"
          unset QA_KEYSTORE
          flutter build apk --release --android-skip-build-dependency-validation --build-number=10021 --dart-define=NASQO_REACT_HYBRID_V2=true --dart-define=NASQO_REACT_HYBRID_ALLOW_WRITES=true
      - name: Verify package, AOT, release mode and known QA signing certificate
        run: |
          set -euo pipefail
          mkdir -p candidate
          cp flutter_app/build/app/outputs/flutter-apk/app-release.apk candidate/NASQO-PRO-QA-10021.apk
          cd candidate
          apk=NASQO-PRO-QA-10021.apk
          bt=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "${bt%/*}/aapt" dump badging "$apk" > "$RUNNER_TEMP/badging"
          head -1 "$RUNNER_TEMP/badging" | grep -F "name='com.indexesstore.nasqo_qa'" | grep -F "versionCode='10021'"
          if grep -q '^application-debuggable' "$RUNNER_TEMP/badging"; then exit 1; fi
          unzip -Z1 "$apk" > "$RUNNER_TEMP/entries"
          grep -Fxq lib/arm64-v8a/libapp.so "$RUNNER_TEMP/entries"
          grep -Fxq assets/flutter_assets/assets/react/index.html "$RUNNER_TEMP/entries"
          "$bt" verify --verbose --print-certs "$apk" > signature.txt
          grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true' signature.txt
          grep -F 'Number of signers: 1' signature.txt
          keytool -printcert -rfc -jarfile "$apk" > "$RUNNER_TEMP/cert.pem"
          openssl x509 -in "$RUNNER_TEMP/cert.pem" -outform DER -out "$RUNNER_TEMP/cert.der"
          echo "0df120c5300269f289cf66ccf48aa9ce81e295055e9f7ae80159ee021e3a5a79  $RUNNER_TEMP/cert.der" | sha256sum -c -
          sha256sum "$apk" > apk.sha256
          echo "$GITHUB_SHA" > source-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: nasqo-qa-10021-candidate
          path: candidate
          if-no-files-found: error
          retention-days: 14
