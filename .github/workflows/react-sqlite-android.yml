name: React offline Android and SQLite
on:
  push:
    branches: [integration/react-sqlite-0d734ca-20261122]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  debug:
    if: github.ref_name == 'integration/react-sqlite-0d734ca-20261122'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: stable
          cache: true
      - name: Build packaged React and verify its transport and offline manifest
        run: |
          npm ci --ignore-scripts --no-audit
          npm run check:runtime
          npm run build:hybrid
      - name: Analyze Flutter
        working-directory: flutter_app
        run: |
          flutter config --jdk-dir="$JAVA_HOME"
          flutter pub get
          flutter analyze --no-fatal-infos
      - name: Run Flutter tests with the native SQLite loader
        working-directory: flutter_app
        run: bash ../qa/tools/test-linux.sh
      - name: Build Android Debug APK
        working-directory: flutter_app
        run: |
          flutter build apk --debug --android-skip-build-dependency-validation
          cd build/app/outputs/flutter-apk
          sha256sum app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: nasqo-react-sqlite-debug
          path: flutter_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
  offline-android:
    needs: debug
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: nasqo-react-sqlite-debug
          path: apk
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit
      - name: Enable hardware acceleration for the test emulator
        run: |
          test -c /dev/kvm
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
      - name: Cold start in airplane mode, post using production bridge and inspect device database
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          disable-linux-hw-accel: false
          script: node qa/react_sqlite/android.mjs apk/app-debug.apk android-evidence
      - name: Compare the live reference at the actual WebView viewport
        if: always() && hashFiles('android-evidence/first-launch-ui.json') != ''
        run: node qa/react_sqlite/web_reference.mjs android-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nasqo-android-sqlite-evidence
          path: android-evidence/
          retention-days: 14
